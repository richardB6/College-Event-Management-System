<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Events — ClubHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-layout">
    <button class="sidebar-toggle" type="button" onclick="toggleSidebar()" aria-label="Toggle navigation">☰</button>
    <aside class="sidebar" id="sidebar">
        <a class="sidebar-brand" href="admin.html"><span class="brand-mark">C</span><span class="brand-copy"><strong>clubhub</strong><small>Campus workspace</small></span></a>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="sidebar-nav" aria-label="Admin navigation">
            <a href="admin.html"><span class="nav-icon">◫</span>Overview</a>
            <a href="admin-clubs.html"><span class="nav-icon">◇</span>Clubs</a>
            <a href="admin-events.html" class="active"><span class="nav-icon">▦</span>Events</a>
            <a href="students.html"><span class="nav-icon">○</span>Students</a>
            <a href="registrations.html"><span class="nav-icon">↗</span>Registrations</a>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer"><a href="index.html" class="sidebar-site-link"><span>↗</span> View campus site</a><button onclick="logoutAdmin()" class="btn btn-secondary btn-sm sidebar-logout">Sign out</button></div>
    </aside>
    <main class="main-content">
        <header class="top-header">
            <div class="page-heading"><span class="eyebrow">WORKSPACE / EVENTS</span><h1>Events</h1><p class="header-subtitle">Bring your campus community together.</p></div>
            <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle color theme" title="Toggle theme"><span aria-hidden="true">◐</span></button>
        </header>
        <div class="page-content">
            <section class="section-panel form-panel">
                <div class="section-header"><div><span class="eyebrow">CAMPUS CALENDAR</span><h2 id="eventFormTitle">Schedule an event</h2></div></div>
                <div class="section-body">
                    <form id="eventForm" onsubmit="handleEventSubmit(event)">
                        <input type="hidden" id="editEventId">
                        <div class="form-grid">
                            <div class="form-group"><label for="eventName">Event name</label><input type="text" id="eventName" placeholder="e.g. Annual Hackathon" required></div>
                            <div class="form-group"><label for="eventDate">Event date</label><input type="date" id="eventDate" required></div>
                            <div class="form-group"><label for="eventLocation">Location</label><input type="text" id="eventLocation" placeholder="e.g. Main auditorium" required></div>
                            <div class="form-group"><label for="eventClubId">Organizing club</label><select id="eventClubId" required><option value="">Select a club</option></select></div>
                        </div>
                        <div class="form-actions"><button type="submit" class="btn btn-primary" id="eventSubmitBtn">Add event <span aria-hidden="true">＋</span></button><button type="button" class="btn btn-secondary" id="eventCancelBtn" onclick="cancelEventEdit()" hidden>Cancel</button></div>
                    </form>
                </div>
            </section>
            <section class="section-panel">
                <div class="section-header section-header-tools">
                    <div><span class="eyebrow">CAMPUS CALENDAR</span><h2>All events</h2></div>
                    <div class="table-tools">
                        <label class="search-field"><span aria-hidden="true">⌕</span><input id="eventSearch" type="search" placeholder="Search events…" aria-label="Search events" oninput="filterEvents()"></label>
                        <label class="filter-field"><span class="visually-hidden">Filter by club</span><select id="eventClubFilter" onchange="filterEvents()"><option value="">All clubs</option></select></label>
                    </div>
                </div>
                <div class="table-container"><table><thead><tr><th>Event</th><th>Date</th><th>Location</th><th>Club</th><th>Actions</th></tr></thead><tbody id="eventsTableBody"><tr><td colspan="5" class="empty-state">Loading events…</td></tr></tbody></table></div>
            </section>
        </div>
    </main>
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>
    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', () => { loadEvents(); loadClubsDropdown('eventClubId'); loadClubsDropdown('eventClubFilter', true); });</script>
</body>
</html>
