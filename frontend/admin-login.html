<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin sign in — ClubHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="public-layout login-page">
    <header class="main-navbar">
        <a class="nav-brand" href="index.html"><span class="brand-mark">C</span><span>clubhub</span></a>
        <nav class="nav-links" aria-label="Main navigation"><a href="index.html">Explore</a><a href="students.html">Students</a><a href="registrations.html">Registrations</a></nav>
        <div class="nav-actions"><button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle color theme" title="Toggle theme"><span aria-hidden="true">◐</span></button></div>
    </header>
    <main class="login-main">
        <section class="login-container">
            <span class="login-mark">C</span>
            <span class="eyebrow">CAMPUS WORKSPACE</span>
            <h1>Welcome back</h1>
            <p>Sign in to manage your campus community.</p>
            <form id="loginForm" onsubmit="handleLogin(event)">
                <div class="form-group"><label for="adminPassword">Admin password</label><input type="password" id="adminPassword" placeholder="Enter your password" autocomplete="current-password" required></div>
                <button type="submit" class="btn btn-primary login-submit">Sign in <span aria-hidden="true">→</span></button>
            </form>
            <a class="login-back" href="index.html">← Back to ClubHub</a>
        </section>
    </main>
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>
    <script src="app.js"></script>
</body>
</html>
