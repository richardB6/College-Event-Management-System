<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage Clubs — Admin Panel</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <button class="sidebar-toggle" id="sidebarToggle" onclick="toggleSidebar()">☰</button>

    <aside class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-icon">🛡️</div>
            <div>
                <h2>Admin Panel</h2>
                <span>ClubHub System</span>
            </div>
        </div>
        <nav class="sidebar-nav">
            <a href="admin.html">
                <span class="nav-icon">📊</span> Dashboard
            </a>
            <a href="admin-clubs.html" class="active">
                <span class="nav-icon">🏛️</span> Manage Clubs
            </a>
            <a href="admin-events.html">
                <span class="nav-icon">🎉</span> Manage Events
            </a>
        </nav>
        <div class="sidebar-footer">
            <a href="index.html" style="color: var(--text-muted); display: block; margin-bottom: 12px;">← Back to Main Site</a>
            <button onclick="logoutAdmin()" class="btn btn-secondary btn-sm" style="width: 100%;">🚪 Logout</button>
        </div>
    </aside>

    <main class="main-content">
        <header class="top-header">
            <div>
                <h1>Manage Clubs</h1>
                <p class="header-subtitle">Add, edit, or remove clubs</p>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
        </header>

        <div class="page-content">
            <div class="section-panel">
                <div class="section-header">
                    <h2 id="clubFormTitle"><span class="icon">➕</span> Add New Club</h2>
                </div>
                <div class="section-body">
                    <form id="clubForm" onsubmit="handleClubSubmit(event)">
                        <input type="hidden" id="editClubId">
                        <div class="form-grid">
                            <div class="form-group">
                                <label for="clubName">Club Name</label>
                                <input type="text" id="clubName" placeholder="e.g. Coding Club" required>
                            </div>
                        </div>
                        <div class="form-actions">
                            <button type="submit" class="btn btn-primary" id="clubSubmitBtn">➕ Add Club</button>
                            <button type="button" class="btn btn-secondary" id="clubCancelBtn" onclick="cancelClubEdit()" style="display:none;">✕ Cancel</button>
                        </div>
                    </form>
                </div>
            </div>

            <div class="section-panel">
                <div class="section-header">
                    <h2><span class="icon">📋</span> All Clubs</h2>
                </div>
                <div class="section-body">
                    <div class="table-container">
                        <table>
                            <thead>
                                <tr>
                                    <th>ID</th>
                                    <th>Club Name</th>
                                    <th>Actions</th>
                                </tr>
                            </thead>
                            <tbody id="clubsTableBody">
                                <tr><td colspan="3" class="empty-state"><p>Loading...</p></td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadClubs();
        });
    </script>
</body>
</html>
