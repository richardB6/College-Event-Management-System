<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clubs — ClubHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="admin-layout">
    <button class="sidebar-toggle" type="button" onclick="toggleSidebar()" aria-label="Toggle navigation">☰</button>
    <aside class="sidebar" id="sidebar">
        <a class="sidebar-brand" href="admin.html"><span class="brand-mark">C</span><span class="brand-copy"><strong>clubhub</strong><small>Campus workspace</small></span></a>
        <div class="sidebar-label">WORKSPACE</div>
        <nav class="sidebar-nav" aria-label="Admin navigation">
            <a href="admin.html"><span class="nav-icon">◫</span>Overview</a>
            <a href="admin-clubs.html" class="active"><span class="nav-icon">◇</span>Clubs</a>
            <a href="admin-events.html"><span class="nav-icon">▦</span>Events</a>
            <a href="students.html"><span class="nav-icon">○</span>Students</a>
            <a href="registrations.html"><span class="nav-icon">↗</span>Registrations</a>
        </nav>
        <div class="sidebar-spacer"></div>
        <div class="sidebar-footer"><a href="index.html" class="sidebar-site-link"><span>↗</span> View campus site</a><button onclick="logoutAdmin()" class="btn btn-secondary btn-sm sidebar-logout">Sign out</button></div>
    </aside>
    <main class="main-content">
        <header class="top-header">
            <div class="page-heading"><span class="eyebrow">WORKSPACE / CLUBS</span><h1>Clubs</h1><p class="header-subtitle">Create and manage the communities on campus.</p></div>
            <button class="theme-toggle" type="button" onclick="toggleTheme()" aria-label="Toggle color theme" title="Toggle theme"><span aria-hidden="true">◐</span></button>
        </header>
        <div class="page-content">
            <section class="section-panel form-panel">
                <div class="section-header"><div><span class="eyebrow">CLUB DIRECTORY</span><h2 id="clubFormTitle">Add a club</h2></div></div>
                <div class="section-body">
                    <form id="clubForm" onsubmit="handleClubSubmit(event)">
                        <input type="hidden" id="editClubId">
                        <div class="form-grid form-grid-single"><div class="form-group"><label for="clubName">Club name</label><input type="text" id="clubName" placeholder="e.g. Coding Club" required></div></div>
                        <div class="form-actions"><button type="submit" class="btn btn-primary" id="clubSubmitBtn">Add club <span aria-hidden="true">＋</span></button><button type="button" class="btn btn-secondary" id="clubCancelBtn" onclick="cancelClubEdit()" hidden>Cancel</button></div>
                    </form>
                </div>
            </section>
            <section class="section-panel">
                <div class="section-header section-header-tools">
                    <div><span class="eyebrow">CAMPUS COMMUNITY</span><h2>All clubs</h2></div>
                    <label class="search-field"><span aria-hidden="true">⌕</span><input id="clubSearch" type="search" placeholder="Search clubs…" aria-label="Search clubs" oninput="filterTable('clubSearch','clubsTableBody')"></label>
                </div>
                <div class="table-container"><table><thead><tr><th>Club</th><th>Club ID</th><th>Actions</th></tr></thead><tbody id="clubsTableBody"><tr><td colspan="3" class="empty-state">Loading clubs…</td></tr></tbody></table></div>
            </section>
        </div>
    </main>
    <div class="toast-container" id="toastContainer" aria-live="polite"></div>
    <script src="app.js"></script>
    <script>document.addEventListener('DOMContentLoaded', loadClubs);</script>
</body>
</html>
