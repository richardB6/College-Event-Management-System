<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registrations — ClubHub</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="public-layout">

    <header class="main-navbar">
        <div class="nav-brand">
            <div class="nav-brand-icon">🎓</div>
            ClubHub
        </div>
        <nav class="nav-links">
            <a href="index.html">Home</a>
            <a href="students.html">Students</a>
            <a href="registrations.html" class="active">Registrations</a>
        </nav>
        <div style="display: flex; gap: 12px; align-items: center;">
            <button class="theme-toggle" onclick="toggleTheme()" title="Toggle Theme">🌓</button>
            <a href="admin-login.html" class="btn btn-secondary btn-sm">🛡️ Admin Panel</a>
        </div>
    </header>

    <main class="page-content" style="max-width: 1200px; margin: 0 auto; padding: 40px 20px;">
        <header style="margin-bottom: 30px;">
            <h1 style="font-size: 2rem; margin-bottom: 8px;">Event Registrations</h1>
            <p style="color: var(--text-secondary);">Register students for upcoming club events.</p>
        </header>

        <!-- Registration Form -->
        <div class="section-panel">
            <div class="section-header">
                <h2><span class="icon">➕</span> New Registration</h2>
            </div>
            <div class="section-body">
                <form id="registrationForm" onsubmit="handleRegistrationSubmit(event)">
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="regStudentId">Student</label>
                            <select id="regStudentId" required>
                                <option value="">— Select Student —</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="regEventId">Event</label>
                            <select id="regEventId" required>
                                <option value="">— Select Event —</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="regEntryFee">Entry Fee (₹)</label>
                            <input type="number" id="regEntryFee" placeholder="e.g. 200" min="0" step="0.01" required>
                        </div>
                    </div>
                    <div class="form-actions">
                        <button type="submit" class="btn btn-primary">📝 Register</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Registrations Table -->
        <div class="section-panel">
            <div class="section-header">
                <h2><span class="icon">📋</span> All Registrations</h2>
            </div>
            <div class="section-body">
                <div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Reg ID</th>
                                <th>Student Name</th>
                                <th>Event Name</th>
                                <th>Club Name</th>
                                <th>Entry Fee</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="registrationsTableBody">
                            <tr><td colspan="6" class="empty-state"><p>Loading...</p></td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </main>

    <div class="toast-container" id="toastContainer"></div>
    <script src="app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadRegistrations();
            loadStudentsDropdown();
            loadEventsDropdown();
        });
    </script>
</body>
</html>
