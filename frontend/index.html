<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClubHub — Home</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="public-layout">

    <header class="main-navbar">
        <div class="nav-brand">
            <div class="nav-brand-icon">🎓</div>
